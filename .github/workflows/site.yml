# Construction et déploiement du site sur GitHub Pages + collecte quotidienne des vélos BikeStocks.
# - push sur main      : tests, build, contrôles, déploiement (pas de collecte)
# - chaque nuit (cron) : collecte (si SHOW_BIKES=true), commit de data/bikes.json, puis build et déploiement
# - bouton « Run workflow » (onglet Actions) : idem cron, collecte forcée même si SHOW_BIKES=false
# Si la collecte échoue, le job s'arrête en rouge AVANT le déploiement : le site en ligne garde la dernière
# sélection valide, et GitHub envoie un e-mail d'échec au propriétaire du dépôt.
name: Site

on:
  push:
    branches: [main]
  schedule:
    - cron: "23 4 * * *" # 4h23 UTC = 5h23 (hiver) / 6h23 (été) à Paris
  workflow_dispatch:

permissions:
  contents: write # commit de data/bikes.json
  pages: write
  id-token: write

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Tests
        run: npm test

      - name: Collecte BikeStocks
        if: github.event_name != 'push'
        run: |
          if [ "$(node -p "require('./data/site.json').SHOW_BIKES")" = "true" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            npm run collect
          else
            echo "Module vélos désactivé (SHOW_BIKES=false) : pas de collecte."
          fi

      - name: Commit de la sélection
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/bikes.json
          if git diff --cached --quiet; then echo "Sélection inchangée."; exit 0; fi
          git commit -m "Vélos BikeStocks : sélection du $(date -u +%F)"
          git pull --rebase
          git push

      - id: pages
        uses: actions/configure-pages@v5

      - name: Build
        run: npm run build
        env:
          PATH_PREFIX: ${{ steps.pages.outputs.base_path }}/

      - name: Contrôles du site généré
        run: npm run check

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
